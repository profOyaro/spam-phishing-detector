services:
  frontend:
    build: .
    ports: ["8501:8501"]
    command: streamlit run app.py --server.address=0.0.0.0
    volumes: ["./data:/app/data"]
  backend:
    build: .
    ports: ["8000:8000"]
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000
    volumes: ["./data:/app/data"]
